name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reconstruct ESP-IDF Project Structure
        run: |
          # Create ESP-IDF standard directories
          mkdir -p project/main
          mkdir -p project/components

          # Copy main application files
          cp BLUE_NOW.cpp project/main/main.cpp || cp main.cpp project/main/main.cpp || true
          cp *.h project/main/ || true
          cp idf_component.yml project/main/ || true
          cp CMakeLists_main.txt project/main/CMakeLists.txt || true
          cp sdkconfig.defaults project/ || true

          # Create root CMakeLists.txt
          printf 'cmake_minimum_required(VERSION 3.16)\ninclude($ENV{IDF_PATH}/tools/cmake/project.cmake)\nproject(BLUE_NOW)\n' > project/CMakeLists.txt

          # Copy external components if present
          if [ -f CMakeLists_hub75.txt ]; then
            git clone --depth 1 https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git project/components/ESP32-HUB75-MatrixPanel-I2S-DMA || true
            cp CMakeLists_hub75.txt project/components/ESP32-HUB75-MatrixPanel-I2S-DMA/CMakeLists.txt || true
          fi

          # Build Firmware
          . $IDF_PATH/export.sh
          cd project
          idf.py set-target esp32c3
          idf.py build

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            project/build/bootloader/bootloader.bin
            project/build/partition_table/partition-table.bin
            project/build/*.bin
